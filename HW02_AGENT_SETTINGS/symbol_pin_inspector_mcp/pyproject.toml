[project]
name = "symbol-pin-inspector-mcp"
version = "0.1.0"
description = "MCP server that validates SVG schematic symbols for the HW02 schematic editor."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
symbol-pin-inspector = "symbol_pin_inspector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/symbol_pin_inspector"]
